apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - network-policy.yaml
  - pod-disruption-budget.yaml

labels:
  - pairs:
      app.kubernetes.io/name: hello-app
      app.kubernetes.io/part-of: homelab-example
    includeSelectors: true
