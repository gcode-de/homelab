---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: kube-system
spec:
  schedule: "0 3 */2 * *" # Every other day at 3 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          containers:
            - name: etcd-snapshot
              image: rancher/k3s:v1.34.3-k3s1
              env:
                - name: ETCD_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-s3-credentials
                      key: access-key
                - name: ETCD_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-s3-credentials
                      key: secret-key
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  k3s etcd-snapshot save \
                    --etcd-server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
                    --name scheduled \
                    --snapshot-compress \
                    --etcd-s3 \
                    --etcd-s3-insecure \
                    --etcd-s3-bucket=velero \
                    --etcd-s3-folder=etcd \
                    --etcd-s3-endpoint=10.43.75.163:9000 \
                    --etcd-s3-access-key="$ETCD_S3_ACCESS_KEY" \
                    --etcd-s3-secret-key="$ETCD_S3_SECRET_KEY" \
                    --etcd-s3-region=us-east-1 \
                    --etcd-s3-retention=14
              volumeMounts:
                - name: k3s-data
                  mountPath: /var/lib/rancher/k3s
                - name: k3s-config
                  mountPath: /etc/rancher/k3s
                  readOnly: true
          volumes:
            - name: k3s-data
              hostPath:
                path: /var/lib/rancher/k3s
                type: Directory
            - name: k3s-config
              hostPath:
                path: /etc/rancher/k3s
                type: Directory
          restartPolicy: Never
